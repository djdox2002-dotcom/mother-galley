<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아들들과 함께한 일본여행</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, serif;
            background: #faf8f5;
            min-height: 100vh;
            color: #2c2c2c;
        }
        
        .hero {
            position: relative;
            height: 60vh;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('images/hero-bg.jpg') center/contain no-repeat;
            opacity: 0.85;
        }
        
        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.5) 100%);
        }
        
        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 40px;
        }
        
        .hero h1 {
            font-size: 4rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 8px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
        }
        
        .hero .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            letter-spacing: 3px;
            font-style: italic;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 40px;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 80px;
        }
        
        .photo-card {
            position: relative;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        
        .photo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }
        
        .photo-card img {
            width: 100%;
            height: 280px;
            object-fit: contain;
            background: #f5f5f5;
            display: block;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .photo-card:hover img {
            transform: scale(1.05);
        }
        
        .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 20px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
            color: white;
            opacity: 1;
            transition: opacity 0.4s ease;
        }
        
        .photo-card:hover .photo-overlay {
            opacity: 1;
        }
        
        .photo-title {
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        
        .photo-date {
            font-size: 0.85rem;
            font-weight: 300;
            opacity: 0.9;
        }
        
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            z-index: 1001;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.3s ease;
        }
        
        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        footer {
            text-align: center;
            padding: 60px 20px;
            color: #a89a8a;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 2px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }
        
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
            
            .hero .subtitle {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            
            .container {
                padding: 40px 20px;
            }
            
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
            }
            
            .photo-card img {
                height: 250px;
                object-fit: contain;
                background: #f5f5f5;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1>아들들과 함께한 일본여행</h1>
            <p class="subtitle">Precious Moments in Time</p>
        </div>
    </div>
    
    <div class="container">
        <div class="gallery" id="gallery">
            <!-- 사진들이 여기에 자동으로 추가됩니다 -->
        </div>
    </div>
    
    <footer>
        <p>© 2026 Mother's Gallery — Made with Love</p>
    </footer>
    
    <div class="lightbox" id="lightbox">
        <div class="lightbox-close" onclick="closeLightbox()">×</div>
        <img src="" alt="enlarged" id="lightbox-img">
    </div>
    
    <audio id="bgMusic" loop autoplay>
        <source src="images/bg-music.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        const photos = [
            {"src": "images/photo001.jpg", "title": "추억 1", "date": "2026.06"},
            {"src": "images/photo002.jpg", "title": "추억 2", "date": "2026.06"},
            {"src": "images/photo003.jpg", "title": "추억 3", "date": "2026.06"},
            {"src": "images/photo004.jpg", "title": "추억 4", "date": "2026.06"},
            {"src": "images/photo005.jpg", "title": "추억 5", "date": "2026.06"},
            {"src": "images/photo006.jpg", "title": "추억 6", "date": "2026.06"},
            {"src": "images/photo007.jpg", "title": "추억 7", "date": "2026.06"},
            {"src": "images/photo008.jpg", "title": "추억 8", "date": "2026.06"},
            {"src": "images/photo009.jpg", "title": "추억 9", "date": "2026.06"},
            {"src": "images/photo010.jpg", "title": "추억 10", "date": "2026.06"},
            {"src": "images/photo011.jpg", "title": "추억 11", "date": "2026.06"},
            {"src": "images/photo012.jpg", "title": "추억 12", "date": "2026.06"},
            {"src": "images/photo013.jpg", "title": "추억 13", "date": "2026.06"},
            {"src": "images/photo014.jpg", "title": "추억 14", "date": "2026.06"},
            {"src": "images/photo015.jpg", "title": "추억 15", "date": "2026.06"},
            {"src": "images/photo016.jpg", "title": "추억 16", "date": "2026.06"},
            {"src": "images/photo017.jpg", "title": "추억 17", "date": "2026.06"},
            {"src": "images/photo018.jpg", "title": "추억 18", "date": "2026.06"},
            {"src": "images/photo019.jpg", "title": "추억 19", "date": "2026.06"},
            {"src": "images/photo020.jpg", "title": "추억 20", "date": "2026.06"},
            {"src": "images/photo021.jpg", "title": "추억 21", "date": "2026.06"},
            {"src": "images/photo022.jpg", "title": "추억 22", "date": "2026.06"},
            {"src": "images/photo023.jpg", "title": "추억 23", "date": "2026.06"},
            {"src": "images/photo024.jpg", "title": "추억 24", "date": "2026.06"},
            {"src": "images/photo025.jpg", "title": "추억 25", "date": "2026.06"},
            {"src": "images/photo026.jpg", "title": "추억 26", "date": "2026.06"},
            {"src": "images/photo027.jpg", "title": "추억 27", "date": "2026.06"}
        ];
        
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = photos.map(photo => `
                <div class="photo-card" onclick="openLightbox('${photo.src}')">
                    <img src="${photo.src}" alt="${photo.title}" loading="lazy">
                    <div class="photo-overlay">
                        <div class="photo-title">${photo.title}</div>
                        <div class="photo-date">${photo.date}</div>
                    </div>
                </div>
            `).join('');
        }
        
        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lightbox.classList.add('active');
        }
        
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
        }
        
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });
        
        // 자동 재생 시도
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.5;
        
        function tryPlayMusic() {
            bgMusic.play().then(() => {
                console.log('Music started');
            }).catch(err => {
                console.log('Autoplay blocked, waiting for interaction');
            });
        }
        
        // 즉시 시도
        tryPlayMusic();
        
        // 사용자 상호작용 시 재생
        document.addEventListener('click', tryPlayMusic, { once: true });
        document.addEventListener('touchstart', tryPlayMusic, { once: true });
        document.addEventListener('scroll', tryPlayMusic, { once: true });
        
        renderGallery();
    </script>
</body>
</html>
